name: Living City art-only browser preview
on:
  push:
    branches: [feature/ngoalong-art-v6]
    paths:
      - 'art_review/living_city.html'
      - '.github/workflows/nl-living-city-art-preview.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --prefix "$RUNNER_TEMP/living-city" playwright-core
      - name: Capture actual embedded art and verify interactions
        env:
          NODE_PATH: ${{ runner.temp }}/living-city/node_modules
        run: |
          mkdir -p art_preview
          node <<'JS'
          const {chromium}=require('playwright-core');
          const fs=require('fs'),assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            try {
              const page=await browser.newPage({viewport:{width:1400,height:788},deviceScaleFactor:1});
              const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              await page.setContent(fs.readFileSync('art_review/living_city.html','utf8'));
              await page.waitForFunction(()=>window.artAudit?.().backgroundLoaded);
              await page.waitForTimeout(700);
              const audit=await page.evaluate(()=>artAudit());
              assert.equal(audit.facilities,8);assert.equal(audit.actors,10);
              assert.equal(await page.locator('#land').evaluate(x=>x.naturalWidth),1400);
              await page.screenshot({path:'art_preview/living-city-runtime.png'});
              await page.locator('#clean').click();
              await page.mouse.move(700,450);await page.waitForTimeout(350);
              await page.screenshot({path:'art_preview/living-city-clean.png'});
              await page.keyboard.press('Escape');
              for(let i=0;i<8;i++){
                const pin=page.locator('.pin[data-id="'+i+'"]');
                const name=await pin.getAttribute('aria-label');await pin.click();
                assert.equal(await page.locator('#panel h2').innerText(),name);
                if(i===0)await page.screenshot({path:'art_preview/living-city-facility.png'});
                await page.locator('[data-close]').click();
              }
              await page.locator('#motion').click();assert.equal(await page.evaluate(()=>artAudit().paused),true);
              await page.locator('#motion').click();
              const overlap=await page.evaluate(()=>{const r=[...document.querySelectorAll('.pin')].map(e=>e.getBoundingClientRect());return r.some((a,i)=>r.slice(i+1).some(b=>a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top))});
              assert.equal(overlap,false);assert.deepEqual(errors,[]);
              fs.copyFileSync('art_review/living_city.html','art_preview/living-city-offline.html');
              fs.writeFileSync('art_preview/audit.json',JSON.stringify({...audit,sha:process.env.GITHUB_SHA,overlap,errors,clickTests:8},null,2));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: living-city-art-preview
          path: art_preview/
