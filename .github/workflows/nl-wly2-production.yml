name: WLY2 production source asset build
on:
  push:
    branches: [feature/ngoalong-v1-complete]
    paths: ['.github/workflows/nl-wly2-production.yml', 'tools/build_wly2_source_pack.py', 'tools/nl_art_d2.js', 'tools/build_ngoa_long_items_v1.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and pack complete source library
        run: |
          python -m pip install pillow==11.3.0
          python tools/build_wly2_source_pack.py --cache "$RUNNER_TEMP/wly2-original" --out "$RUNNER_TEMP/wly2-pack.json"
          echo "NL_WLY2_PACK=$RUNNER_TEMP/wly2-pack.json" >> "$GITHUB_ENV"
      - name: Build canonical game, not a mockup
        run: |
          set -euo pipefail
          python tools/validate_ngoalong_data.py
          python tools/build_ngoa_long_mode.py
          python tools/build_ngoa_long_r03.py
          python tools/build_ngoa_long_r04.py
          python tools/build_ngoa_long_items_v1.py
          python tools/build_ngoa_long_items_v1.py --check
          sha256sum index.html | tee qa/wly2-html.sha256
          git rev-parse HEAD > qa/wly2-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ngoalong-one-game-wly2-candidate
          path: |
            index.html
            qa/wly2-html.sha256
            qa/wly2-commit.txt
            ${{ runner.temp }}/wly2-pack.report.json
          if-no-files-found: error
      - name: Actual P2 source renderer smoke
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import json,sys
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          sys.path.insert(0,'qa')
          from nl_native_pve_a1_browser import open_page,errors
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              page=open_page(browser,width=1280)
              page.wait_for_function("__NL_ART_D2_QA__?.ready() && __NL_ART_D2_QA__?.sourceReady()",timeout=120000)
              page.evaluate("""()=>{const q=__P2_QA__;q.beginBattle(1,'campaign');q.debugBattle().next=Date.now()+999999;q.stepBattle()}""")
              page.wait_for_function("__P2_QA__.debugBattle()?.current?.attacker")
              for ms in (70,290,520,790):
                  page.evaluate("(ms)=>{__P41_QA__.setVisualElapsed(ms);__P41_QA__.drawScene(performance.now())}",ms)
                  page.wait_for_timeout(250)
                  page.evaluate("(ms)=>{__P41_QA__.setVisualElapsed(ms);__P41_QA__.drawScene(performance.now())}",ms)
                  page.locator("#battle-canvas").screenshot(path=f"qa/wly2-battle-{ms}.png")
              result=page.evaluate("""()=>{const d=__NL_ART_D2_QA__,q=__P2_QA__;return {troops:d.sourceAtlasCount(),effects:d.sourceEffectCount(),metrics:d.metrics(),save:q.getGame().version}}""")
              print(json.dumps(result))
              Path('qa/wly2-smoke.json').write_text(json.dumps(result,indent=2))
              assert result['troops']==28 and result['effects']>0 and result['metrics']['sourceTroops']>0 and result['metrics']['sourceFx']>0 and result['save']==5 and not errors,(result,errors)
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ngoalong-wly2-runtime-evidence
          path: |
            qa/wly2-battle-*.png
            qa/wly2-smoke.json
          if-no-files-found: warn
