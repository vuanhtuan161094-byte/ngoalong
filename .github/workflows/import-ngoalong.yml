name: Import verified Muu Dinh Tam Quoc D4 snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-ngoalong.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'vuanhtuan161094-byte/ngoalong'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Import exact public source tree (binary and text)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --depth=1 --no-tags https://github.com/vuanhtuan161094-byte/Heoofgaia.git refs/heads/feature/nl-web-review-20261122
          source=f16df9d7b7d569e4b98998551ddaa9fba314dc33
          test "$(git rev-parse FETCH_HEAD)" = "$source"
          test "$(git rev-parse "$source^{tree}")" = 35df6e103429b0768062846837b38709ad1a5332
          # Workflows are restored separately with the authorized repository connector.
          # GITHUB_TOKEN may not be allowed to create or modify workflow files.
          importer=$(git rev-parse HEAD:.github/workflows/import-ngoalong.yml)
          git read-tree "$source^{tree}"
          git rm --cached -r -f .github/workflows
          git update-index --add --cacheinfo "100644,$importer,.github/workflows/import-ngoalong.yml"
          tree=$(git write-tree)
          diff=$(git diff-tree --no-commit-id --name-only -r "$source^{tree}" "$tree" -- . ':(exclude).github/workflows')
          test -z "$diff"
          git config user.name 'Ngoa Long migration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          new=$(printf '%s\n' 'Import exact D4 game tree from Heoofgaia f16df9d (workflow restoration pending)' | git commit-tree "$tree" -p "$GITHUB_SHA")
          git push origin "$new:refs/heads/main"
          echo "Source SHA: $source"
          echo "Destination SHA: $new"
          echo "Verified identical non-workflow tree entries."
